<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://accounts.google.com https://cdn.jsdelivr.net https://www.paypal.com https://*.paypal.com https://*.paypalobjects.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com https://*.paypal.com https://*.paypalobjects.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com https://api.elevenlabs.io wss://api.elevenlabs.io https://*.elevenlabs.io wss://*.elevenlabs.io https://*.paypal.com https://cdn.jsdelivr.net; media-src 'self' blob: data: https://*.elevenlabs.io; worker-src 'self' blob:; frame-src https://accounts.google.com https://*.paypal.com https://iframe.mediadelivery.net https://player.mediadelivery.net; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi cuenta · APEL</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#C8FF2E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/apel.css?v=20261126a">

<body>
<header class="top"><div class="wrap">
  <a class="brand" href="../" aria-label="APEL, inicio">APEL</a>
  <nav class="nav" aria-label="Cuenta" id="nav"><a class="keep" href="../tienda.html">Tienda</a></nav>
</div></header>
<main class="wrap" id="app" style="padding-bottom:80px"></main>

<div class="player" id="pl" hidden role="dialog" aria-modal="true" aria-label="Reproductor">
  <div class="bar"><b id="pl-t"></b><span class="row" style="gap:8px"><button class="btn sm" id="pl-fs">Pantalla completa</button><button class="btn sm" id="pl-x">Cerrar</button></span></div>
  <div class="stage" id="pl-st"><div class="ratio" id="pl-r"></div></div>
</div>

<footer><div class="wrap"><span>APEL · Mi cuenta</span><span>Tu acceso es personal: tu cuenta solo puede estar abierta en un dispositivo a la vez.</span></div></footer>

<script>
(function(){
  const A=window.APEL,esc=A.esc,$=id=>document.getElementById(id),app=$('app');
  const S={ps:[],yo:null,tab:'cursos',step:'clave',correo:'',cargando:'',busy:false,err:'',msg:'',sel:null,open:new Set(),code:''};
  const q=new URLSearchParams(location.search);
  const volver=(()=>{const v=q.get('volver')||'';return /^[a-z0-9_\-./?=&%]+$/i.test(v)&&!v.includes('//')&&!v.includes(':')?v:''})();
  const strip=t=>String(t).replace(/^(Módulo|Sesión)\s*\d+\s*·\s*/,'');
  const ICON={video:'VID',pdf:'PDF',audio:'AUD',link:'WEB',drive:'DRV',plantilla:'DAW'};

  /* ---------- entrar: Google, correo y clave, o código por correo (primera vez y recuperación) ---------- */
  const GSI='https://accounts.google.com/gsi/client';
  const vu=t=>`<div class="vu-wait" role="status" aria-live="polite"><span class="vu" aria-hidden="true">${'<i></i>'.repeat(7)}</span><b>${esc(t)}</b></div>`;
  function loginBox(h,lead,inner){
    app.innerHTML=`<div style="max-width:460px;margin:64px auto 0">
      <h1 data-fader style="font-size:clamp(48px,8vw,84px)">${h}</h1>
      <p class="lead" style="font-size:18px">${lead}</p>${inner}
      <p class="hint" style="margin-top:16px">¿Aún no eres alumno? <a href="../tienda.html">Mira la tienda</a> o <a href="../inscripcion.html">inscríbete</a>. · <a href="../privacidad.html">Privacidad</a></p></div>`;
  }
  function viewLogin(){
    const err=`<span class="err" role="alert">${esc(S.err)}</span>${S.msg?`<span class="hint" role="status">${esc(S.msg)}</span>`:''}`;
    if(S.cargando){loginBox('Entrando.','Un momento, estamos abriendo tu cuenta.',`<div class="card">${vu(S.cargando)}</div>`);return}
    if(S.step==='crear'){
      loginBox('Crea tu clave.','Así la próxima vez entras con tu correo y tu clave, sin esperar un código.',
        `<form class="card" id="lf" style="display:flex;flex-direction:column;gap:16px" novalidate>
          <div class="field"><label for="ln">Clave nueva</label><input id="ln" type="password" autocomplete="new-password" minlength="8" required><small class="hint">Mínimo 8 caracteres, con letras y números.</small></div>
          <div class="field"><label for="lr">Repite la clave</label><input id="lr" type="password" autocomplete="new-password" required></div>
          ${err}<button class="btn primary" ${S.busy?'disabled':''}>${S.busy?'Guardando…':'Guardar mi clave'}</button>
          <button type="button" class="btn" id="luego">Ahora no</button></form>`);
      setTimeout(()=>$('ln').focus(),30);
      $('luego').onclick=()=>despues();
      $('lf').onsubmit=async ev=>{ev.preventDefault();if(S.busy)return;S.err='';const n=$('ln').value,r2=$('lr').value;
        if(n.length<8||!/[A-Za-z]/.test(n)||!/[0-9]/.test(n)){S.err='Usa al menos 8 caracteres, con letras y números.';viewLogin();return}
        if(n!==r2){S.err='Las dos claves no coinciden.';viewLogin();return}
        S.busy=true;viewLogin();const r=await A.api('clave_guardar',{nueva:n});S.busy=false;
        if(!r.ok){S.err=r.error;viewLogin();return}S.banner='Listo: tu clave quedó guardada. La próxima vez entra con tu correo y tu clave.';despues()};
      return}
    if(S.step==='correo'||S.step==='codigo'){
      const c=S.step==='correo';
      loginBox(c?'Entra con un código.':'Revisa tu correo.',c?'Para tu primera vez o si olvidaste tu clave: te enviamos un código de 6 dígitos.':`Escribe el código que enviamos a <b>${esc(S.correo)}</b>. Vence en 10 minutos.`,
        `<form class="card" id="lf" style="display:flex;flex-direction:column;gap:16px" novalidate>
          ${c?`<div class="field"><label for="lc">Correo</label><input id="lc" type="email" autocomplete="email" inputmode="email" value="${esc(S.correo)}" required></div>`
          :`<div class="field"><label for="lk">Código</label><input id="lk" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required></div>`}
          ${err}<button class="btn primary" ${S.busy?'disabled':''}>${S.busy?'Un momento…':c?'Enviarme el código':'Entrar'}</button>
          ${c?'':'<button type="button" class="btn" id="otra">Usar otro correo o reenviar</button>'}
          <button type="button" class="btn ghost" id="aclave">Volver: entrar con Google o con mi clave</button></form>`);
      const f=$('lf');const inp=$('lc')||$('lk');setTimeout(()=>inp&&inp.focus(),30);
      $('aclave').onclick=()=>{S.step='clave';S.err='';S.msg='';viewLogin()};
      if($('otra'))$('otra').onclick=()=>{S.step='correo';S.err='';S.msg='';viewLogin()};
      if($('lk'))$('lk').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);if(e.target.value.length===6)f.requestSubmit()};
      f.onsubmit=async ev=>{ev.preventDefault();if(S.busy)return;S.err='';S.msg='';
        if(c){const v=$('lc').value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){S.err='Escribe un correo válido.';viewLogin();return}
          S.correo=v;S.busy=true;viewLogin();const r=await A.api('login_inicio',{correo:v});S.busy=false;
          if(!r.ok){S.err=r.error;viewLogin();return}S.step='codigo';S.msg=r.espera?'Ya te enviamos un código hace un momento: usa ese.':'';viewLogin();return}
        const k=$('lk').value.trim();if(k.length!==6){S.err='Son 6 dígitos.';viewLogin();return}
        S.cargando='Verificando tu código…';viewLogin();
        entrar(await A.api('login_verificar',{correo:S.correo,codigo:k,dispositivo:A.dispositivo()}),true)};
      return}
    // paso principal: Google o correo + clave
    loginBox('Entra a tu cuenta.','Con tu cuenta de Google o con tu correo y tu clave.',
      `<div class="card" style="display:flex;flex-direction:column;gap:16px">
        ${A.GOOGLE_CLIENT_ID?`<div id="gbtn" style="min-height:44px;display:flex;justify-content:center"></div><div class="or-line"><span>o con tu clave</span></div>`:''}
        <form id="lf" style="display:flex;flex-direction:column;gap:16px" novalidate>
          <div class="field"><label for="lc">Correo</label><input id="lc" type="email" autocomplete="username" inputmode="email" value="${esc(S.correo)}" required></div>
          <div class="field"><label for="lp">Clave</label><input id="lp" type="password" autocomplete="current-password" required></div>
          ${err}<button class="btn primary" ${S.busy?'disabled':''}>${S.busy?'Un momento…':'Entrar'}</button>
        </form>
        <button type="button" class="btn ghost" id="acodigo">¿Primera vez u olvidaste tu clave? Entra con un código</button></div>`);
    $('acodigo').onclick=()=>{const v=$('lc').value.trim().toLowerCase();if(v)S.correo=v;S.step='correo';S.err='';S.msg='';viewLogin()};
    $('lf').onsubmit=async ev=>{ev.preventDefault();if(S.busy)return;S.err='';S.msg='';
      const v=$('lc').value.trim().toLowerCase(),p=$('lp').value;S.correo=v;
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){S.err='Escribe un correo válido.';viewLogin();return}
      if(!p){S.err='Escribe tu clave.';viewLogin();setTimeout(()=>$('lp').focus(),30);return}
      S.cargando='Abriendo tu cuenta…';viewLogin();
      const r=await A.api('login_clave',{correo:v,clave:p,dispositivo:A.dispositivo()});
      if(!r.ok&&r.sinClave){S.cargando='';S.step='correo';S.err='';S.msg=r.error;viewLogin();return}
      entrar(r,false)};
    if(!S.correo)setTimeout(()=>$('lc')&&$('lc').focus(),30);
    if(A.GOOGLE_CLIENT_ID)google_();
  }
  // botón oficial de Google (Google Identity Services); al elegir la cuenta se oculta el formulario y sale el cargador
  function google_(){
    const pinta=()=>{const el=$('gbtn');if(!el||!window.google||!google.accounts)return;
      google.accounts.id.initialize({client_id:A.GOOGLE_CLIENT_ID,ux_mode:'popup',auto_select:false,use_fedcm_for_prompt:true,use_fedcm_for_button:true,cancel_on_tap_outside:true,
        callback:async resp=>{S.err='';S.msg='';S.cargando='Entrando con Google…';viewLogin();
          entrar(await A.api('login_google',{credencial:resp.credential,dispositivo:A.dispositivo()}),false)}});
      google.accounts.id.renderButton(el,{theme:'filled_black',shape:'pill',size:'large',text:'continue_with',locale:'es',width:Math.min(400,Math.max(220,el.clientWidth||320))});
      // además la ventanita de Google sin ventana emergente (sirve en navegadores que bloquean pop-ups)
      try{google.accounts.id.prompt()}catch(e){}};
    if(window.google&&google.accounts)return pinta();
    if(!document.querySelector('script[data-gsi]')){const sc=document.createElement('script');sc.src=GSI;sc.async=true;sc.dataset.gsi='1';sc.onload=pinta;
      sc.onerror=()=>{const el=$('gbtn');if(el)el.innerHTML='<span class="hint">No pudimos cargar el botón de Google. Entra con tu clave o con un código.</span>'};document.head.appendChild(sc)}
    else setTimeout(pinta,400);
  }
  function entrar(r,porCodigo){
    S.cargando='';
    if(!r||!r.ok){S.err=(r&&r.error)||'No pudimos entrar. Inténtalo de nuevo.';if(porCodigo&&/venció|nuevo/i.test(S.err))S.step='correo';viewLogin();return}
    A.sesion.set({token:r.token,correo:r.correo,vence:r.vence});S.correo=r.correo;
    S.banner=r.cerradas&&r.cerradas.length?'Cerramos tu sesión en '+r.cerradas.join(', ')+'. Tu cuenta solo puede estar abierta en un dispositivo a la vez.':'';
    if(porCodigo&&!r.tieneClave){S.step='crear';S.err='';viewLogin();return}
    despues();
  }
  function despues(){S.step='clave';S.err='';S.msg='';if(volver){location.href='../'+volver;return}load()}

  /* ---------- datos ---------- */
  async function load(quiet){
    if(!quiet)app.innerHTML=`<div style="padding:80px 0;display:flex;justify-content:center">${vu('Cargando tu cuenta…')}</div>`;
    const r=await A.api('yo');
    if(!r.ok){if(r.sesion===false||!A.sesion.get()){S.yo=null;S.step='clave';S.err=r.sesion===false?'Tu sesión se cerró: tu cuenta se abrió en otro dispositivo o venció. Vuelve a entrar.':'';render();return}
      app.innerHTML=`<div class="notice" style="margin-top:48px">${esc(r.error)}</div>`;return}
    S.yo=r;render();
  }
  const has=t=>S.yo.accesos.some(a=>a.tipo===t);
  function myPrograms(){
    const codes=new Set();S.yo.accesos.forEach(a=>{if(a.programa&&(a.tipo==='clase'||a.tipo==='vod'))codes.add(a.programa)});
    if(has('suscripcion'))S.yo.videos.forEach(v=>codes.add(v.programa));
    return S.ps.filter(p=>codes.has(p.code));
  }

  /* ---------- vistas ---------- */
  const TABS=[['cursos','Mis cursos'],['videos','Videoteca'],['vivo','En vivo'],['cuenta','Mi cuenta']];
  function render(){
    $('nav').innerHTML='<a class="keep" href="../tienda.html">Tienda</a>'+(S.yo?'<button class="btn sm" id="out">Salir</button>':'');
    if($('out'))$('out').onclick=async()=>{await A.api('salir');A.sesion.set(null);S.yo=null;S.step='clave';try{window.google&&google.accounts&&google.accounts.id.disableAutoSelect()}catch(e){}render()};
    if(!S.yo){viewLogin();return}
    const nP=myPrograms().length,nLive=S.yo.lives.filter(l=>l.mio&&!l.terminada).length;
    app.innerHTML=`<div class="portal-head"><div><span class="eyebrow" style="display:inline-flex;align-items:center;gap:10px">${S.yo.perfil&&S.yo.perfil.foto?`<img src="${esc(S.yo.perfil.foto)}" alt="" width="28" height="28" referrerpolicy="no-referrer" style="border-radius:50%">`:''}${S.yo.perfil&&S.yo.perfil.nombre?esc(S.yo.perfil.nombre)+' · ':''}${esc(S.yo.correo)}</span><h1 data-fader>${S.tab==='videos'?'Videoteca':S.tab==='vivo'?'En vivo':S.tab==='cuenta'?'Mi cuenta':'Mis cursos'}</h1></div></div>
      ${S.banner?`<div class="okmsg" role="status" style="margin:8px 0 0">${esc(S.banner)}</div>`:''}
      <nav class="tabs" aria-label="Secciones">${TABS.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${S.tab===k}">${esc(l)}${k==='cursos'&&nP?` · ${nP}`:''}${k==='vivo'&&nLive?` · ${nLive}`:''}</button>`).join('')}</nav>
      <div id="tab"></div>`;
    ({cursos:vCursos,videos:vVideos,vivo:vVivo,cuenta:vCuenta})[S.tab]();
    moderador();
  }

  /* ---------- moderador de clases (ElevenLabs) ----------
     El agente es privado: el servidor solo entrega un enlace firmado (vale ~15 min) a alumnos
     con sesión y programa activo, con un tope diario. Sin enlace firmado no se puede conversar. */
  /* El agente es privado: se conecta con el cliente oficial de ElevenLabs usando el enlace firmado
     que entrega el servidor (el widget embebido solo funciona con agentes públicos). */
  const EL_SDK='https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.35.0/dist/lib.iife.js';
  let MOD=null; // conversación activa
  function moderador(){
    const mine=S.yo?myPrograms():[];
    let box=$('modBox');
    if(!mine.length){if(MOD){try{MOD.endSession()}catch(e){}MOD=null}if(box)box.remove();return}
    if(box)return;
    box=document.createElement('div');box.id='modBox';box.setAttribute('role','region');box.setAttribute('aria-label','Moderador APEL');
    box.style.cssText='position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)';
    box.innerHTML='<span id="modSt" aria-live="polite" style="display:none;background:var(--paper,#ECEEE4);color:var(--ink,#16150F);border:2px solid var(--ink,#16150F);border-radius:999px;padding:10px 16px;font-weight:650"></span>'+
      '<button id="modBtn" class="btn primary" type="button" style="box-shadow:0 6px 20px rgba(22,21,15,.25)">Moderador APEL</button>';
    document.body.appendChild(box);$('modBtn').onclick=()=>MOD?cerrarModerador():abrirModerador();
  }
  function modEstado(t){const e=$('modSt');if(!e)return;e.textContent=t||'';e.style.display=t?'':'none'}
  function cargarSDK(){return window.ElevenLabsClient?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src=EL_SDK;s.onload=ok;s.onerror=()=>no(new Error('sdk'));document.head.appendChild(s)})}
  async function cerrarModerador(){const c=MOD;MOD=null;try{if(c)await c.endSession()}catch(e){}fin()}
  function fin(){MOD=null;const b=$('modBtn');if(b){b.disabled=false;b.textContent='Moderador APEL'}modEstado('')}
  async function abrirModerador(){
    const b=$('modBtn');const mine=myPrograms();const p=mine.find(x=>x.code===S.sel)||mine[0];
    b.disabled=true;b.textContent='Conectando…';modEstado('');
    try{
      modEstado('Pidiendo acceso…');const r=await A.api('moderador',{programa:p.code});
      if(r&&r.ok){modEstado('Cargando la conexión…');await cargarSDK();modEstado('Conectando el micrófono…')}
      if(!r||!r.ok){fin();S.banner=(r&&r.error)||'El moderador no está disponible ahora (el servidor no respondió).';render();scrollTo(0,0);return}
      MOD=await ElevenLabsClient.Conversation.startSession({
        signedUrl:r.url,connectionType:'websocket',
        dynamicVariables:{alumno_nombre:(S.yo.perfil&&S.yo.perfil.nombrePila)||'',programa:p.code+' · '+p.name,hasta_modulo:String(r.hastaModulo||'')},
        onConnect:()=>{b.disabled=false;b.textContent='Terminar';modEstado('Escuchando…')},
        onModeChange:({mode})=>modEstado(mode==='speaking'?'Hablando…':'Escuchando…'),
        onDisconnect:()=>fin(),
        onError:m=>{console.warn('moderador',m);modEstado('Error: '+String(m).slice(0,120))}
      });
      b.disabled=false;b.textContent='Terminar';
    }catch(e){
      fin();
      const mic=e&&/permission|notallowed|denied/i.test(String(e.name||'')+String(e.message||''));
      const det=String((e&&(e.message||e.reason||e.name))||e||'').slice(0,160);S.banner=mic?'Para hablar con el moderador, permite el micrófono en tu navegador y vuelve a intentarlo.':'No pudimos conectar con el moderador. Detalle: '+(det||'sin detalle');
      render();scrollTo(0,0);console.warn('moderador',e);
    }
  }
  const vcard=v=>`<button class="vcard" data-play="${esc(v.id)}" ${v.bloqueado?'disabled':''} aria-label="${esc((v.bloqueado?'Bloqueado: ':'Ver ')+v.titulo)}">
    <span class="play" aria-hidden="true">${v.bloqueado?'🔒':'▶'}</span><b>${esc(v.titulo)}</b>
    <small>${esc(v.programa)} · módulo ${v.modulo}${v.duracion?' · '+esc(v.duracion):''}${v.gratis?' · muestra gratis':''}</small>
    ${v.bloqueado?`<span class="lock">${esc(v.bloqueado)}</span>`:''}</button>`;

  function vCursos(){
    const mine=myPrograms();const t=$('tab');
    if(!mine.length){t.innerHTML=`<div class="card" style="display:flex;flex-direction:column;gap:12px;align-items:flex-start"><b style="font-size:20px">Todavía no tienes programas activos.</b><span class="hint">Compra un programa o una mensualidad en la tienda, o canjea tu código.</span><div class="row"><a class="btn primary" href="../tienda.html">Ir a la tienda</a><button class="btn" data-tab="cuenta" data-focus="code">Canjear un código</button></div></div>`;return}
    if(!S.sel||!mine.find(p=>p.code===S.sel))S.sel=mine[0].code;
    const p=mine.find(x=>x.code===S.sel);const sc=A.SCHOOLS[p.school]||{};
    const acc=S.yo.accesos.filter(a=>a.programa===p.code);const clase=acc.find(a=>a.tipo==='clase');
    const full=acc.some(a=>a.tipo==='vod')||has('suscripcion');const hasta=!full&&clase&&clase.hastaModulo?clase.hastaModulo:0;
    if(!S.open.size&&p.modules.length)S.open.add(p.code+'-'+(hasta?Math.min(hasta,p.modules.length):1));
    t.innerHTML=`${mine.length>1?`<nav class="tabs" aria-label="Mis programas">${mine.map(x=>`<button data-sel="${esc(x.code)}" aria-pressed="${x.code===S.sel}">${esc(x.code)} · ${esc(x.name)}</button>`).join('')}</nav>`:''}
      <p style="margin:0 0 20px" class="row"><span class="tag" style="--c:${sc.color}"><i></i>${esc(p.code)} · ${esc(sc.name||'')}</span>${acc.map(a=>`<span class="pill">${esc(A.TIPOS[a.tipo]||a.tipo)}${a.hasta?' · hasta '+esc(A.fecha(a.hasta)):''}</span>`).join('')}</p>
      ${panelAvance(p,hasta)}
      ${p.modules.map(m=>{const k=p.code+'-'+m.n,lock=hasta&&m.n>hasta;
        const vids=S.yo.videos.filter(v=>v.programa===p.code&&v.modulo===m.n);const mats=S.yo.material.filter(x=>x.programa===p.code&&x.modulo===m.n);
        if(lock)return `<div class="mod" style="opacity:.55"><div style="display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;padding:18px 20px"><span style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-weight:800">${m.n}</span><span><b style="display:block;font-size:17px">${esc(strip(m.title))}</b><small class="hint">Se abre cuando lleguemos a este módulo en clase</small></span></div></div>`;
        const st=estadoMod(p,m,hasta),tr=tareaDe(p.code,m.n);
        return `<details class="mod" data-k="${esc(k)}" id="mod-${esc(k)}" ${S.open.has(k)?'open':''}><summary><span class="n${st.k==='hecho'?' ok':st.k==='curso'?' now':''}">${st.k==='hecho'?'✓':m.n}</span><span><b>${esc(strip(m.title))}</b><small>${esc(m.goal?m.goal.charAt(0).toUpperCase()+m.goal.slice(1):'')}</small></span><span class="mstate ${tr.tarea==='Rehacer'?'redo':st.k}">${esc(st.t)}${m.homework?` · ${esc(TAREA[tr.tarea||'']||'Tarea pendiente')}`:''}</span></summary>
          <div class="body">
            ${vids.length?`<div class="vgrid">${vids.map(vcard).join('')}</div>`:''}
            ${m.points.length?`<div><span class="lbl">Lo que verás</span><ul>${m.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
            ${mats.length?`<div><span class="lbl">Material de apoyo</span><div class="mats" style="margin-top:6px">${mats.map(x=>`<a class="mat" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><span class="ic">${esc(ICON[x.tipo]||'WEB')}</span><span><b>${esc(x.titulo)}</b>${x.nota?`<small>${esc(x.nota)}</small>`:''}</span></a>`).join('')}</div></div>`:''}
            ${m.homework?bloqueTarea(p,m,tr):''}
          </div></details>`}).join('')}`;
  }

  /* ---------- Avance del alumno ----------
     Módulos: los marca el profesor con «Hasta módulo» (los anteriores están vistos y ese está en curso).
     Tareas: el alumno las marca como hechas; el profesor las revisa en la hoja Avance (nota y comentario). */
  const TAREA={'':'Tarea pendiente',Enviada:'Tarea enviada',Revisada:'Tarea revisada',Rehacer:'Tarea por rehacer'};
  const tareaDe=(prog,n)=>((S.yo&&S.yo.avance)||[]).find(a=>a.programa===prog&&a.modulo===n)||{};
  function estadoMod(p,m,hasta){
    const tr=tareaDe(p.code,m.n);
    if(hasta){if(m.n<hasta)return{k:'hecho',t:'Visto'};if(m.n===hasta)return{k:'curso',t:'En curso'};return{k:'pend',t:'Pendiente'}}
    if(tr.tarea==='Revisada')return{k:'hecho',t:'Completado'};
    return{k:'libre',t:'Disponible'};
  }
  function panelAvance(p,hasta){
    const N=p.modules.length;if(!N)return'';
    const est=p.modules.map(m=>estadoMod(p,m,hasta));
    const hechos=est.filter(e=>e.k==='hecho').length,curso=p.modules.find((m,i)=>est[i].k==='curso')||p.modules.find((m,i)=>est[i].k!=='hecho');
    const pct=Math.round((hechos+(est.some(e=>e.k==='curso')?.5:0))/N*100);
    const abiertos=p.modules.filter((m,i)=>est[i].k!=='pend'),conTarea=abiertos.filter(m=>m.homework);
    const enviadas=conTarea.filter(m=>['Enviada','Revisada'].includes(tareaDe(p.code,m.n).tarea)).length;
    const pendientes=conTarea.filter(m=>{const t=tareaDe(p.code,m.n).tarea||'';return t===''||t==='Rehacer'});
    const notas=((S.yo&&S.yo.avance)||[]).filter(a=>a.programa===p.code&&a.nota!=null);
    const prom=notas.length?(notas.reduce((s,a)=>s+a.nota,0)/notas.length):null;
    const faltan=p.modules.filter((m,i)=>est[i].k==='pend');
    const unidad=/sesi/i.test(p.modules[0].title||'')?'sesión':'módulo';
    return `<section class="avance" aria-label="Tu avance en ${esc(p.code)}">
      <div class="av-top"><div><span class="eyebrow">Tu avance</span><b class="av-pct">${pct}<small>%</small></b></div>
        <div class="av-now">${curso?`<span class="hint">${hechos===N?'Terminaste el programa':'Vas en'}</span><b>${hechos===N?'¡Felicitaciones!':esc(unidad.charAt(0).toUpperCase()+unidad.slice(1))+' '+curso.n+' de '+N}</b>${hechos===N?'':`<small>${esc(strip(curso.title))}</small>`}`:''}</div></div>
      <div class="av-bar" role="img" aria-label="${hechos} de ${N} vistos">${est.map((e,i)=>`<i class="${e.k}" title="${esc((i+1)+' · '+strip(p.modules[i].title)+' · '+e.t)}"></i>`).join('')}</div>
      <div class="av-stats">
        <span><b>${hechos}</b> de ${N} ${unidad==='sesión'?'sesiones':'módulos'} ${hasta?'vistos':'completados'}</span>
        <span><b>${enviadas}</b> de ${conTarea.length} tareas entregadas</span>
        ${prom!=null?`<span>Promedio <b>${prom.toFixed(1)}</b> / 10</span>`:''}
        ${!hasta?'':`<span><b>${faltan.length}</b> por ver</span>`}
      </div>
      ${pendientes.length?`<div class="av-todo"><span class="lbl">Lo que tienes pendiente</span>${pendientes.map(m=>{const t=tareaDe(p.code,m.n);return `<a class="av-item" href="#mod-${esc(p.code+'-'+m.n)}" data-ir="${esc(p.code+'-'+m.n)}"><span class="n">${m.n}</span><span><b>${t.tarea==='Rehacer'?'Rehacer la tarea':'Tarea'} · ${esc(strip(m.title))}</b><small>${esc(t.comentario||m.homework)}</small></span></a>`}).join('')}</div>`:`<p class="hint" style="margin:0">${conTarea.length?'No tienes tareas pendientes. ¡Vas al día!':'Las tareas aparecen aquí cuando se abren los módulos.'}</p>`}
      ${faltan.length?`<div class="av-next"><span class="lbl">Lo que viene</span><div class="chips">${faltan.slice(0,4).map(m=>`<span>${m.n} · ${esc(strip(m.title))}</span>`).join('')}${faltan.length>4?`<span>y ${faltan.length-4} más</span>`:''}</div></div>`:''}
    </section>`;
  }
  function bloqueTarea(p,m,tr){
    const k=p.code+'-'+m.n,t=tr.tarea||'';
    const estado=t==='Revisada'?`<span class="tstate ok">Revisada${tr.nota!=null?` · Nota ${esc(String(tr.nota))} / 10`:''}</span>`:t==='Enviada'?`<span class="tstate wait">Enviada${tr.enviada?' el '+esc(A.fecha(tr.enviada)):''} · el profesor la revisará</span>`:t==='Rehacer'?`<span class="tstate redo">Por rehacer</span>`:`<span class="tstate">Pendiente</span>`;
    const form=S.tareaAbierta===k?`<form class="tform" data-tarea="${esc(k)}"><label for="tl-${esc(k)}">Enlace a tu trabajo (opcional)</label><input id="tl-${esc(k)}" name="enlace" type="url" inputmode="url" placeholder="https://drive.google.com/…" value="${esc(tr.enlace||'')}"><span class="hint">Por ejemplo, un archivo en Google Drive, SoundCloud o YouTube con acceso por enlace.</span><div class="row"><button class="btn primary sm" type="submit"${S.busy?' disabled':''}>Enviar tarea</button><button class="btn sm" type="button" data-tarea-cerrar>Cancelar</button></div>${S.tareaErr?`<div class="err" role="alert">${esc(S.tareaErr)}</div>`:''}</form>`:'';
    return `<div class="box tarea"><div class="row" style="justify-content:space-between;align-items:center;gap:10px"><span class="lbl" style="margin:0">Tarea</span>${estado}</div>${esc(m.homework)}
      ${tr.comentario?`<div class="tcom"><span class="lbl">Comentario del profesor</span>${esc(tr.comentario)}</div>`:''}
      ${t!=='Revisada'&&!form?`<div><button class="btn sm${t===''||t==='Rehacer'?' primary':''}" type="button" data-tarea-abrir="${esc(k)}">${t==='Enviada'?'Cambiar el enlace':t==='Rehacer'?'Enviar de nuevo':'Ya hice la tarea'}</button></div>`:''}${form}</div>`;
  }

  function vVideos(){
    const t=$('tab');const vs=S.yo.videos;
    if(!vs.length){t.innerHTML='<div class="notice">Pronto publicamos los primeros videos.</div>';return}
    const progs=[...new Set(vs.map(v=>v.programa))];
    t.innerHTML=progs.map(code=>{const p=S.ps.find(x=>x.code===code);const l=vs.filter(v=>v.programa===code);const locked=l.filter(v=>v.bloqueado).length;
      return `<section style="border:0;padding:0 0 32px"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="font-size:24px;margin:0">${esc(code)} · ${esc(p?p.name:'')}</h2>${locked?`<a class="btn sm" href="../tienda.html">Desbloquear ${locked}</a>`:''}</div><div class="vgrid">${l.map(vcard).join('')}</div></section>`}).join('');
  }

  function vVivo(){
    const t=$('tab');const ls=S.yo.lives;
    if(!ls.length){t.innerHTML='<div class="notice">No hay clases en vivo programadas por ahora.</div>';return}
    const now=Date.now();
    t.innerHTML=`<div class="list">${ls.map(l=>{const d=new Date(l.fecha);const abre=new Date(l.abreEn);
      const act=l.terminada?'<span class="pill">Terminó</span>':l.mio?(l.meet?`<a class="btn primary" href="${esc(l.meet)}" target="_blank" rel="noopener noreferrer">Entrar a la clase</a>`:`<span class="hint">El enlace aparece aquí ${abre-now<864e5?'a las '+esc(abre.toLocaleTimeString('es',{hour:'numeric',minute:'2-digit'})):'15 minutos antes'}.<br>También te llegó la invitación por correo.</span>`)
        :l.enVenta?`<a class="btn primary sm" href="../tienda.html?p=${encodeURIComponent(l.id)}">Reservar cupo</a>`:'<span class="pill">Sin cupos</span>';
      return `<div class="card live"><div class="when"><small>${esc(d.toLocaleDateString('es',{month:'short'}))}</small><b>${d.getDate()}</b><small>${esc(d.toLocaleDateString('es',{weekday:'short'}))}</small></div>
        <div><b style="font-size:18px">${esc(l.nombre)}</b><div class="hint">${esc(d.toLocaleTimeString('es',{hour:'numeric',minute:'2-digit'}))} (tu hora) · ${l.duracion} min${l.mio?' · <span class="mio">Tienes cupo</span>':''}</div>${l.descripcion?`<div class="hint">${esc(l.descripcion)}</div>`:''}</div>
        <div>${act}</div></div>`}).join('')}</div>`;
  }

  function vCuenta(){
    const t=$('tab');const y=S.yo;
    t.innerHTML=`<div class="grid g2" style="align-items:start">
      <section class="card" style="display:flex;flex-direction:column;gap:12px" id="codigo"><h2 style="font-size:22px;margin:0">Canjear un código</h2>
        <form id="cf" class="row" novalidate><label class="sr" for="cc">Código</label><input id="cc" placeholder="APEL-XXXX-XXXX" autocomplete="off" style="flex:1;min-width:200px;text-transform:uppercase;letter-spacing:.08em" value="${esc(S.code)}"><button class="btn primary" ${S.busy?'disabled':''}>Canjear</button></form>
        <span class="err" role="alert" id="ce">${esc(S.err)}</span>${S.msg?`<div class="okmsg" role="status">${esc(S.msg)}</div>`:''}</section>
      <section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:22px;margin:0">${y.tieneClave?'Cambiar mi clave':'Crea tu clave'}</h2>
        <span class="hint">${y.tieneClave?'Entras con tu correo y tu clave, o con Google.':'Así entras con tu correo y tu clave, sin esperar un código.'}</span>
        <form id="kf" style="display:flex;flex-direction:column;gap:12px" novalidate>
          <input type="email" autocomplete="username" value="${esc(y.correo)}" hidden readonly>
          ${y.tieneClave&&!y.puedeSinActual?'<div class="field"><label for="ka">Clave actual</label><input id="ka" type="password" autocomplete="current-password"></div>':''}
          <div class="field"><label for="kn">Clave nueva</label><input id="kn" type="password" autocomplete="new-password" minlength="8"><small class="hint">Mínimo 8 caracteres, con letras y números.</small></div>
          <span class="err" role="alert" id="ke">${esc(S.kerr||'')}</span>${S.kmsg?`<div class="okmsg" role="status">${esc(S.kmsg)}</div>`:''}
          <button class="btn primary" ${S.kbusy?'disabled':''}>${S.kbusy?'Guardando…':'Guardar clave'}</button></form></section>
      <section class="card" style="display:flex;flex-direction:column;gap:8px"><h2 style="font-size:22px;margin:0">Mi país</h2>
        ${y.pais?`<span><b>${esc(y.nombrePais)}</b> · <span class="hint">define tus precios y quedó fijo en tu cuenta. Si te mudaste, escríbenos.</span></span>`:'<span class="hint">Lo confirmas en la tienda antes de tu primer pago. Define tus precios.</span>'}</section>
      <section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:22px;margin:0">Mis accesos</h2>
        ${y.accesos.length?`<div class="list">${y.accesos.map(a=>`<div class="li"><span><b>${esc(a.nombre)}</b><br><small>${esc(A.TIPOS[a.tipo]||'')}${a.hasta?' · hasta '+esc(A.fecha(a.hasta)):' · sin vencimiento'}</small></span>${a.tipo==='clase'||a.tipo==='suscripcion'?`<a class="btn sm" href="../tienda.html?p=${encodeURIComponent(a.producto)}">Renovar</a>`:''}</div>`).join('')}</div>`:'<span class="hint">Aún no tienes accesos activos.</span>'}</section>
      <section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:22px;margin:0">Mis pagos</h2>
        ${y.pagos.length?`<div class="list">${y.pagos.map(p=>`<div class="li"><span><b>${esc(p.producto)}</b> · ${A.usd(p.monto)}<br><small>${esc(p.metodo)} · ${p.fecha?esc(A.fecha(p.fecha)):''}</small></span><span class="pill ${p.estado==='Verificado'?'ok':p.estado==='Pendiente'?'wait':''}">${esc(p.estado==='Verificado'?'Aprobado':p.estado==='Pendiente'?'En revisión':'No aprobado')}</span></div>`).join('')}</div>`:'<span class="hint">Sin pagos todavía.</span>'}</section>
      <section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:22px;margin:0">Dispositivos</h2>
        <span class="hint">${y.maxSesiones>1?`Puedes tener hasta ${y.maxSesiones} dispositivos con sesión abierta. Al entrar en uno nuevo se cierra el más antiguo.`:'Tu cuenta solo puede estar abierta en un dispositivo. Si entras desde otro, este se cierra al instante. El acceso es personal e intransferible.'}</span>
        <div class="list">${y.sesiones.map(s=>`<div class="li"><span><b>${esc(s.dispositivo)}</b><br><small>${s.actual?'Este dispositivo':'Último uso '+esc(A.fecha(s.ultimo,true))}</small></span></div>`).join('')}</div>
        ${y.sesiones.length>1?'<button class="btn" id="sx">Cerrar sesión en los otros dispositivos</button>':''}</section>
    </div>`;
    $('cf').onsubmit=async e=>{e.preventDefault();const c=$('cc').value.trim();S.code=c;S.err='';S.msg='';if(!c){S.err='Escribe tu código.';vCuenta();return}
      S.busy=true;vCuenta();const r=await A.api('canjear',{codigo:c});S.busy=false;
      if(!r.ok){S.err=r.error;vCuenta();return}S.code='';const okm=`Listo: ${r.nombre} activo${r.hasta?' hasta el '+A.fecha(r.hasta):''}.`;await load(true);S.tab='cuenta';S.msg=okm;render()};
    $('kf').onsubmit=async e=>{e.preventDefault();if(S.kbusy)return;S.kerr='';S.kmsg='';const n=$('kn').value;
      if(n.length<8||!/[A-Za-z]/.test(n)||!/[0-9]/.test(n)){S.kerr='Usa al menos 8 caracteres, con letras y números.';vCuenta();return}
      S.kbusy=true;vCuenta();const r=await A.api('clave_guardar',{nueva:n,actual:$('ka')?$('ka').value:''});S.kbusy=false;
      if(!r.ok){S.kerr=r.error;vCuenta();return}S.kmsg='Listo: tu clave quedó guardada.';S.yo.tieneClave=true;vCuenta()};
    if($('sx'))$('sx').onclick=async()=>{const r=await A.api('salir_todo');if(r.ok){S.msg='';await load(true)}};
    if(S.focus==='code'){S.focus=null;setTimeout(()=>$('cc').focus(),30)}
  }

  /* ---------- reproductor protegido ---------- */
  let wmTimer=null;
  async function play(id){
    const v=S.yo.videos.find(x=>x.id===id);if(!v||v.bloqueado)return;
    $('pl').hidden=false;$('pl-t').textContent=v.titulo;$('pl-r').innerHTML='<p style="color:#fff;text-align:center;padding-top:20%">Preparando el video…</p>';
    const r=await A.api('ver_video',{video:id});
    if(!r.ok){$('pl-r').innerHTML=`<p style="color:#fff;text-align:center;padding-top:20%">${esc(r.error)}</p>`;return}
    $('pl-r').innerHTML=`<iframe src="${esc(r.url)}" loading="eager" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" title="${esc(r.titulo)}"></iframe><span class="wm" id="wm">${esc(r.marca)}</span>`;
    const move=()=>{const w=$('wm');if(!w)return;w.style.left=(5+Math.random()*60)+'%';w.style.top=(6+Math.random()*80)+'%'};move();clearInterval(wmTimer);wmTimer=setInterval(move,12000);
    $('pl-x').focus();
  }
  function closePl(){$('pl').hidden=true;$('pl-r').innerHTML='';clearInterval(wmTimer);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
  $('pl-x').onclick=closePl;
  // pantalla completa del reproductor entero (no del iframe), para que la marca de agua siga visible
  $('pl-fs').onclick=()=>{const st=$('pl');if(document.fullscreenElement)document.exitFullscreen();else if(st.requestFullscreen)st.requestFullscreen().catch(()=>{})};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('pl').hidden&&!document.fullscreenElement)closePl()});
  $('pl').addEventListener('contextmenu',e=>e.preventDefault());

  app.addEventListener('click',e=>{
    const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;S.banner='';S.err='';S.msg='';if(tb.dataset.focus)S.focus=tb.dataset.focus;history.replaceState(null,'','#'+S.tab);render();return}
    const sl=e.target.closest('[data-sel]');if(sl){S.sel=sl.dataset.sel;S.open.clear();render();return}
    const pv=e.target.closest('[data-play]');if(pv){play(pv.dataset.play)}
    /* avance: abrir el módulo de una tarea pendiente, y marcar tareas como hechas */
    const ir=e.target.closest('[data-ir]');if(ir){e.preventDefault();S.open.add(ir.dataset.ir);vCursos();const d=$('mod-'+ir.dataset.ir);if(d)d.scrollIntoView({behavior:'smooth',block:'start'});return}
    const ab=e.target.closest('[data-tarea-abrir]');if(ab){S.tareaAbierta=ab.dataset.tareaAbrir;S.tareaErr='';vCursos();const i=$('tl-'+S.tareaAbierta);if(i)i.focus();return}
    if(e.target.closest('[data-tarea-cerrar]')){S.tareaAbierta='';S.tareaErr='';vCursos();return}
  });
  app.addEventListener('submit',async e=>{
    const f=e.target.closest('form.tform');if(!f)return;e.preventDefault();if(S.busy)return;
    const [prog,mod]=f.dataset.tarea.split('-');const enlace=f.elements.enlace.value.trim();
    if(enlace&&!/^https:\/\//i.test(enlace)){S.tareaErr='El enlace debe empezar con https://';vCursos();return}
    S.busy=true;vCursos();const r=await A.api('tarea_lista',{programa:prog,modulo:Number(mod),enlace});S.busy=false;
    if(!r.ok){S.tareaErr=/no válida/i.test(r.error||'')?'Esta función se está activando. Inténtalo más tarde o envíale la tarea a tu profesor por WhatsApp.':r.error;vCursos();return}
    S.yo.avance=r.avance||[];S.tareaAbierta='';S.tareaErr='';vCursos();
  });
  app.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.mod')){d.open?S.open.add(d.dataset.k):S.open.delete(d.dataset.k)}},true);
  // en la pestaña En vivo, refresca cada minuto para mostrar el enlace a tiempo
  setInterval(()=>{if(S.yo&&S.tab==='vivo'&&!document.hidden)load(true)},60000);

  (async function(){
    const h=location.hash.slice(1);if(['cursos','videos','vivo','cuenta'].includes(h))S.tab=h;if(h==='codigo'){S.tab='cuenta';S.focus='code'}
    try{S.ps=await A.programs()}catch(e){}
    if(!A.API_URL){app.innerHTML='<div class="notice" style="margin-top:48px">Las cuentas aún no están conectadas. Vuelve pronto.</div>';return}
    if(!A.sesion.get()){render();return}
    const trade=q.get('binance');
    await load();
    if(trade&&S.yo){const r=await A.api('binance_revisar',{trade});history.replaceState(null,'','./#'+S.tab);
      S.banner=r.ok&&r.estado==='PAID'?'Pago con Binance confirmado: tu acceso ya está activo.':r.ok?'Estamos esperando la confirmación de Binance. Tu acceso se activa solo en unos minutos; te llegará un correo.':(r.error||'');
      await load(true)}
    const ss=q.get('stripe');
    if(ss&&S.yo){S.banner='Confirmando tu pago con tarjeta…';render();let r=null;
      for(let k=0;k<4;k++){r=await A.api('stripe_revisar',{session:ss});if(!r.ok||r.estado!=='PENDIENTE')break;await new Promise(z=>setTimeout(z,2500))}
      history.replaceState(null,'','./#'+S.tab);
      S.banner=r&&r.ok&&r.estado==='PAID'?'¡Pago con tarjeta confirmado! Tu acceso ya está activo y te enviamos un correo.':r&&r.ok&&r.estado==='REVISION'?'Recibimos tu pago, pero el país de la tarjeta no coincide con el de tu cuenta. Lo revisamos y te escribimos pronto.':r&&r.ok?'Estamos esperando la confirmación del pago. Tu acceso se activa solo en unos minutos; te llegará un correo.':((r&&r.error)||'');
      await load(true)}
  })();
})();
